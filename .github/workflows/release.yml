# Release: build .deb, AppImage and attach to GitHub Release on version tag (issues #64, #37)
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/^#define VERSION \"[^\"]*\"/#define VERSION \"${VERSION}\"/" version.h.in

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt5-qmake qtbase5-dev libqt5svg5-dev qttools5-dev \
            libboost-test-dev libboost-dev \
            libjpeg-dev libpng-dev libtiff-dev zlib1g-dev

      - name: Build .deb
        run: ./build-deb.sh build

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v5
        with:
          name: deb-package
          path: scantailor-advanced_*_amd64.deb

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/^#define VERSION \"[^\"]*\"/#define VERSION \"${VERSION}\"/" version.h.in

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt5-qmake qtbase5-dev libqt5svg5-dev qttools5-dev \
            libboost-test-dev libboost-dev \
            libjpeg-dev libpng-dev libtiff-dev zlib1g-dev \
            file

      - name: Build and install to AppDir
        run: |
          mkdir build-appimage && cd build-appimage
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr ..
          make -j$(nproc)
          make install DESTDIR=AppDir

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        env:
          VERSION: ${{ github.ref_name }}
          DISABLE_COPYRIGHT_FILES_DEPLOYMENT: 1
        run: |
          cd build-appimage
          export QMAKE=/usr/bin/qmake
          ../linuxdeploy-x86_64.AppImage --appdir AppDir -e AppDir/usr/bin/scantailor --output appimage
          OUT=$(ls -1 *.AppImage 2>/dev/null | head -1)
          mv "$OUT" "../scantailor-advanced-${{ github.ref_name }}-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: scantailor-advanced-*-x86_64.AppImage

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-qt5-svg
            mingw-w64-ucrt-x86_64-qt5-tools
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-zlib
            zip

      - name: Configure and build
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DPORTABLE_VERSION=ON
          cmake --build build --config Release

      - name: Package Standalone Windows Application
        shell: msys2 {0}
        run: |
          ROOT_DIR="$(pwd)"
          PKG_DIR="$ROOT_DIR/package/scantailor-advanced-windows-x64"
          mkdir -p "$PKG_DIR/translations"

          # Copy main executable
          cp build/scantailor.exe "$PKG_DIR/"

          # Run windeployqt to deploy Qt libraries and plugins
          windeployqt --release --no-compiler-runtime "$PKG_DIR/scantailor.exe" || true

          # Copy compiled translations (.qm files)
          cp build/translations/*.qm "$PKG_DIR/translations/" 2>/dev/null || cp src/translations/*.qm "$PKG_DIR/translations/" 2>/dev/null || true

          # Copy necessary MSYS2/UCRT64 shared libraries and runtime DLLs
          cp /ucrt64/bin/libgcc_s_*.dll "$PKG_DIR/" 2>/dev/null || true
          cp /ucrt64/bin/libstdc++-*.dll "$PKG_DIR/" 2>/dev/null || true
          cp /ucrt64/bin/libwinpthread-*.dll "$PKG_DIR/" 2>/dev/null || true
          cp /ucrt64/bin/zlib1.dll "$PKG_DIR/" 2>/dev/null || true
          cp /ucrt64/bin/libpng16-*.dll "$PKG_DIR/" 2>/dev/null || true
          cp /ucrt64/bin/libjpeg-*.dll "$PKG_DIR/" 2>/dev/null || true
          cp /ucrt64/bin/libtiff-*.dll "$PKG_DIR/" 2>/dev/null || true
          cp /ucrt64/bin/libdeflate*.dll "$PKG_DIR/" 2>/dev/null || true
          cp /ucrt64/bin/libzstd*.dll "$PKG_DIR/" 2>/dev/null || true
          cp /ucrt64/bin/liblzma-*.dll "$PKG_DIR/" 2>/dev/null || true
          cp /ucrt64/bin/libboost_unit_test_framework*.dll "$PKG_DIR/" 2>/dev/null || true

          # Ensure Qt plugins are deployed properly
          if [ ! -d "$PKG_DIR/platforms" ]; then
            mkdir -p "$PKG_DIR/platforms"
            cp /ucrt64/share/qt5/plugins/platforms/qwindows.dll "$PKG_DIR/platforms/" 2>/dev/null || cp /ucrt64/plugins/platforms/qwindows.dll "$PKG_DIR/platforms/" 2>/dev/null || true
          fi
          if [ ! -d "$PKG_DIR/styles" ]; then
            mkdir -p "$PKG_DIR/styles"
            cp /ucrt64/share/qt5/plugins/styles/*.dll "$PKG_DIR/styles/" 2>/dev/null || cp /ucrt64/plugins/styles/*.dll "$PKG_DIR/styles/" 2>/dev/null || true
          fi
          if [ ! -d "$PKG_DIR/imageformats" ]; then
            mkdir -p "$PKG_DIR/imageformats"
            cp /ucrt64/share/qt5/plugins/imageformats/*.dll "$PKG_DIR/imageformats/" 2>/dev/null || cp /ucrt64/plugins/imageformats/*.dll "$PKG_DIR/imageformats/" 2>/dev/null || true
          fi
          if [ ! -d "$PKG_DIR/iconengines" ]; then
            mkdir -p "$PKG_DIR/iconengines"
            cp /ucrt64/share/qt5/plugins/iconengines/*.dll "$PKG_DIR/iconengines/" 2>/dev/null || cp /ucrt64/plugins/iconengines/*.dll "$PKG_DIR/iconengines/" 2>/dev/null || true
          fi

          # Create zip archive
          cd "$ROOT_DIR/package"
          zip -r "../scantailor-advanced-${{ github.ref_name }}-windows-x64.zip" scantailor-advanced-windows-x64
          cd "$ROOT_DIR"

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: scantailor-advanced-*-windows-x64.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-deb, build-appimage, build-windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb-package
      - uses: actions/download-artifact@v4
        with:
          name: appimage
      - uses: actions/download-artifact@v4
        with:
          name: windows-package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            scantailor-advanced_*_amd64.deb
            scantailor-advanced-*-x86_64.AppImage
            scantailor-advanced-*-windows-x64.zip
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
